name: Deploy Mercado Pago

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-mercadopago-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}
      MERCADO_PAGO_WEBHOOK_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}
      GA4_MEASUREMENT_ID: ${{ secrets.GA4_MEASUREMENT_ID }}
      GA4_API_SECRET: ${{ secrets.GA4_API_SECRET }}
      SITE_URL: ${{ secrets.SITE_URL }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN e SUPABASE_PROJECT_ID."
            exit 1
          fi
      - name: Configure Mercado Pago secrets
        run: |
          if [ -n "$MERCADO_PAGO_ACCESS_TOKEN" ] && [ -n "$MERCADO_PAGO_WEBHOOK_SECRET" ] && [ -n "$SITE_URL" ]; then
            supabase secrets set \
              MERCADO_PAGO_ACCESS_TOKEN="$MERCADO_PAGO_ACCESS_TOKEN" \
              MERCADO_PAGO_WEBHOOK_SECRET="$MERCADO_PAGO_WEBHOOK_SECRET" \
              SITE_URL="$SITE_URL" \
              --project-ref "$PROJECT_ID"
          else
            echo "::warning::O checkout exige os dois Secrets do Mercado Pago e SITE_URL."
          fi
      - name: Configure GA4 server-side secrets when available
        run: |
          if [ -n "$GA4_MEASUREMENT_ID" ] && [ -n "$GA4_API_SECRET" ]; then
            supabase secrets set \
              GA4_MEASUREMENT_ID="$GA4_MEASUREMENT_ID" \
              GA4_API_SECRET="$GA4_API_SECRET" \
              --project-ref "$PROJECT_ID"
          else
            echo "::warning::O purchase do GA4 via servidor exige GA4_MEASUREMENT_ID e GA4_API_SECRET."
          fi
      - name: Deploy checkout
        run: supabase functions deploy create-checkout --project-ref "$PROJECT_ID" --no-verify-jwt
      - name: Deploy payment webhook
        run: supabase functions deploy mercadopago-webhook --project-ref "$PROJECT_ID" --no-verify-jwt
      - name: Deploy public payment status verifier
        run: supabase functions deploy payment-status --project-ref "$PROJECT_ID" --no-verify-jwt
