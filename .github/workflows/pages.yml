name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar versão pública
        run: |
          mkdir -p _site/sistema/admin _site/sistema/central _site/sistema/convite
          cp index.html politicas.html manifest.json robots.txt sitemap.xml _site/
          cp -R assets data _site/
          rm -rf _site/data/orders
          cp sistema/admin/index.html sistema/admin/admin.css sistema/admin/github-admin.js _site/sistema/admin/
          cp sistema/central/index.html sistema/central/central.css sistema/central/central.js _site/sistema/central/
          cp sistema/convite/index.html sistema/convite/invite.js _site/sistema/convite/
          touch _site/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
