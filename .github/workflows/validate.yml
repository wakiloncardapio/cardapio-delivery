name: Validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          find assets sistema/admin -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate PHP
        run: |
          find sistema -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate JSON
        run: |
          python -m json.tool manifest.json >/dev/null
          find data -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null
