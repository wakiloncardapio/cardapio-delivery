name: Validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          find assets sistema -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate Supabase Edge Functions
        run: |
          find supabase/functions -name 'index.ts' -print0 | xargs -0 -n1 deno check --no-lock
      - name: Validate PHP
        run: |
          find sistema -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate JSON
        run: |
          python -m json.tool manifest.json >/dev/null
          find data -name '*.json' -print0 | xargs -0 -n1 python -m json.tool >/dev/null
