name: Ativar base multiempresa

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-multitenant-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validar credenciais
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN e SUPABASE_PROJECT_ID."
            exit 1
          fi

      - name: Configurar endereço da plataforma
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Configure SITE_URL com a raiz pública do projeto."
            exit 1
          fi
          supabase secrets set PLATFORM_URL="${SITE_URL%/}" --project-ref "$PROJECT_ID"

      - name: Publicar funções compatíveis com empresas
        run: |
          for function_name in platform-admin whatsapp-order order-email create-checkout payment-status meta-conversions confirmed-conversions mercadopago-webhook; do
            supabase functions deploy "$function_name" --project-ref "$PROJECT_ID" --no-verify-jwt
          done
