name: Ativar base multiempresa

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-multitenant-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: tamwadldvmspvmstqggc
      SITE_URL: https://seu-food-cardapios.wakilonferreira.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validar credenciais
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Configure somente o Secret SUPABASE_ACCESS_TOKEN."
            exit 1
          fi

      - name: Configurar endereço da plataforma
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Configure SITE_URL com a raiz pública do projeto."
            exit 1
          fi
          supabase secrets set PLATFORM_URL="${SITE_URL%/}" --project-ref "$PROJECT_ID"

      - name: Publicar funções compatíveis com empresas
        run: |
          # A Central exige JWT válido no gateway e também valida o administrador no código.
          supabase functions deploy platform-admin --project-ref "$PROJECT_ID"
          supabase functions deploy payment-settings --project-ref "$PROJECT_ID"

          # Estas rotas recebem checkout público ou webhooks externos. Cada uma faz
          # a própria validação de pedido, empresa, assinatura, prazo ou consentimento.
          for function_name in whatsapp-order order-email create-checkout payment-status meta-conversions confirmed-conversions mercadopago-webhook analytics-event; do
            supabase functions deploy "$function_name" --project-ref "$PROJECT_ID" --no-verify-jwt
          done
