name: Deploy order-email

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-order-email-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::Configure SUPABASE_ACCESS_TOKEN e SUPABASE_PROJECT_ID antes de executar este workflow."
            exit 1
          fi

      - name: Deploy order-email function
        run: supabase functions deploy order-email --project-ref "$PROJECT_ID" --no-verify-jwt
